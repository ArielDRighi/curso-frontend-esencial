  <path d="M45 18 Q45 13 50 18 Q50 23 45 18" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M55 20 Q55 15 60 20 Q60 25 55 20" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Spring Boot leaf -->
